<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090509">
  <meta name="description" content="Rose — una rosa digital que florece en luz y partículas.">
  <title>Rose — JIN2</title>
  <style>
    :root { color-scheme: dark; --pink:#ff789f; --muted:#b7a2ad; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; background:#090509; }
    body {
      min-height:100svh; overflow-x:hidden; color:#f8eaf0;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(ellipse at 50% 43%, rgba(111,20,48,.25), transparent 46%),
        radial-gradient(ellipse at 50% 100%, rgba(64,13,33,.25), transparent 50%),
        #090509;
    }
    body::before {
      content:""; position:fixed; inset:0; pointer-events:none; opacity:.24;
      background-image:radial-gradient(#ffd6e2 0.65px, transparent .65px);
      background-size:38px 38px;
      mask-image:linear-gradient(to bottom, transparent, black 25%, black 80%, transparent);
    }
    main { width:min(100%, 1120px); min-height:100svh; margin:auto; padding:clamp(22px,5vw,54px) 18px 28px;
      display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; }
    .eyebrow { color:#d79aaf; font: 10px/1.4 system-ui,sans-serif; letter-spacing:.38em; text-transform:uppercase; }
    h1 { margin:12px 0 6px; font-size:clamp(38px,7vw,66px); font-weight:400; letter-spacing:.08em; text-align:center;
      text-shadow:0 0 26px rgba(255,82,130,.28); }
    .subtitle { margin:0 0 22px; color:var(--muted); font-size:clamp(13px,2vw,16px); font-style:italic; text-align:center; }
    .stage { width:min(100%, 760px); position:relative; isolation:isolate; }
    .stage::before { content:""; position:absolute; inset:12% 12%; z-index:-1; border-radius:50%;
      background:rgba(176,24,67,.12); filter:blur(65px); }
    .game-frame { display:block; width:100%; aspect-ratio:9/8; border:0; background:#000;
      border-radius:4px; box-shadow:0 24px 90px rgba(0,0,0,.7), 0 0 1px rgba(255,155,183,.25); }
    .caption { margin:19px 0 0; color:#a98c99; font:11px/1.8 system-ui,sans-serif; letter-spacing:.18em; text-align:center; text-transform:uppercase; }
    .ornament { display:flex; align-items:center; gap:13px; margin-top:20px; color:#bd607e; font-size:13px; }
    .ornament::before,.ornament::after { content:""; width:42px; height:1px; background:linear-gradient(90deg,transparent,#8f3a58); }
    .ornament::after { transform:scaleX(-1); }
    footer { margin-top:22px; color:#79636e; font:10px/1.7 system-ui,sans-serif; letter-spacing:.12em; text-align:center; }
    @media(max-width:560px) {
      main { padding:28px 10px 20px; }
      .game-frame { border-radius:2px; }
      .caption { margin-top:12px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Entre Todas Las Almas Te Pude Ver.</div>
    <h1>Aurora</h1>
    <p class="subtitle">Algunas cosas florecen en silencio.</p>
    <section class="stage" aria-label="Animación de una rosa digital">
      <iframe class="game-frame" src="./game/index.html" title="Animación Rose" allow="fullscreen; autoplay" loading="eager"></iframe>
    </section>
    <p class="caption">Let it bloom · 20 seconds</p>
    <div class="ornament" aria-hidden="true">✦</div>
    <footer>Av2026</footer>
  </main>
</body>
</html>
